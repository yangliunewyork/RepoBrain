[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repobrain"
version = "0.1.0"
description = "SLM-powered repository intelligence: local-first documentation generation for source repositories."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RepoBrain" }]
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "tree-sitter>=0.23,<0.24",
    "tree-sitter-java>=0.23,<0.24",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
repobrain = "repobrain.cli:main"

[tool.setuptools.packages.find]
include = ["repobrain*"]

[tool.setuptools.package-data]
repobrain = ["default_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
